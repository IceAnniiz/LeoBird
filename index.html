<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leo Game Center">
<title>Leo Game Center</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:"Courier New",monospace;}
#app{width:100vw;height:100vh;position:relative;}
#menu{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:absolute;inset:0;overflow:hidden;}
#starsBg{position:absolute;inset:0;pointer-events:none;}
.mc{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;}
.tname{font-size:clamp(30px,9vw,46px);font-weight:900;letter-spacing:5px;color:#fff;text-shadow:0 0 20px #00f7ff,0 0 50px #00f7ff66;line-height:1.1;}
.tsub{font-size:clamp(10px,3vw,13px);color:#00f7ff99;letter-spacing:8px;margin-top:6px;text-transform:uppercase;margin-bottom:32px;}
.cards{display:flex;flex-direction:column;gap:14px;width:min(340px,88vw);}
.card{background:linear-gradient(135deg,#0d1b2a,#1a2a3a);border:1px solid #00f7ff33;border-radius:16px;padding:18px 22px;cursor:pointer;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;transition:border-color .2s,transform .1s;}
.card:active{transform:scale(.97);border-color:#00f7ffaa;}
.ci{font-size:34px;flex-shrink:0;}
.cn{font-size:17px;font-weight:700;color:#fff;letter-spacing:2px;margin-bottom:3px;}
.cd{font-size:11px;color:#00f7ffaa;letter-spacing:1px;}
.ca{color:#00f7ff;font-size:18px;}
.ft{margin-top:28px;font-size:10px;color:#ffffff22;letter-spacing:3px;}
#gameCanvas{display:none;position:fixed;inset:0;touch-action:none;cursor:none;}
#backBtn{position:fixed;top:10px;left:10px;z-index:200;background:#00000099;border:1px solid #00f7ff44;color:#00f7ff;font-family:"Courier New",monospace;font-size:12px;padding:7px 13px;border-radius:8px;cursor:pointer;display:none;}
#joystickWrap{position:fixed;bottom:30px;left:30px;z-index:150;display:none;pointer-events:none;}
#joystickBase{width:100px;height:100px;border-radius:50%;background:rgba(0,247,255,.08);border:2px solid rgba(0,247,255,.25);}
#joystickStick{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(0,247,255,.35);border:2px solid rgba(0,247,255,.7);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;}
#fireBtn{position:fixed;bottom:40px;right:30px;z-index:150;display:none;width:72px;height:72px;border-radius:50%;background:rgba(255,80,80,.15);border:2px solid rgba(255,80,80,.5);color:#ff5050;font-size:22px;font-family:"Courier New",monospace;cursor:pointer;touch-action:none;align-items:center;justify-content:center;}
</style>
</head>

const menuEl=document.getElementById('menu');
const gc=document.getElementById('gameCanvas');
const ctx=gc.getContext('2d');
ctx.imageSmoothingEnabled=false;
const backBtn=document.getElementById('backBtn');
const joystickWrap=document.getElementById('joystickWrap');
const joystickBase=document.getElementById('joystickBase');
const joystickStick=document.getElementById('joystickStick');
const fireBtn=document.getElementById('fireBtn');

// Stars menu bg
const sb=document.getElementById('starsBg');
const sc=sb.getContext('2d');
let stars=[];
function initStars(){sb.width=innerWidth;sb.height=innerHeight;stars=Array.from({length:90},()=>({x:Math.random()*sb.width,y:Math.random()*sb.height,r:Math.random()*1.5+.3,t:Math.random()*6}));}
function animStars(){sc.clearRect(0,0,sb.width,sb.height);stars.forEach(s=>{s.t+=.025;sc.globalAlpha=.2+.7*Math.abs(Math.sin(s.t));sc.fillStyle='#fff';sc.beginPath();sc.arc(s.x,s.y,s.r,0,Math.PI*2);sc.fill();});sc.globalAlpha=1;if(menuEl.style.display!=='none')requestAnimationFrame(animStars);}
initStars();animStars();

let currentGame=null;
function showMenu(){
  if(currentGame){currentGame.stop();currentGame=null;}
  menuEl.style.display='';gc.style.display='none';backBtn.style.display='none';
  joystickWrap.style.display='none';fireBtn.style.display='none';
  gc.width=0;gc.height=0;initStars();animStars();
}
function launchGame(g){
  menuEl.style.display='none';gc.style.display='block';backBtn.style.display='block';
  gc.width=Math.min(innerWidth,480);gc.height=innerHeight;
  gc.style.width=gc.width+'px';gc.style.height=gc.height+'px';
  gc.style.left=((innerWidth-gc.width)/2)+'px';gc.style.top='0';
  currentGame=g;g.start(gc,ctx);
}
document.getElementById('btnG1').onclick=()=>launchGame(Game1);
document.getElementById('btnG2').onclick=()=>launchGame(Game2);
backBtn.onclick=showMenu;

// ===================== GAME1: LEO BIRD =====================
const Game1=(()=>{
  const BI=new Image();BI.src=FACE_B64;
  let W,H,bird,pipes,score,best,state,frame,raf;
  const PW=65,G=.45,J=-9,BS=26,SP=3;
  const GAP=()=>H*.27;
  function init(){bird={x:W*.25,y:H*.45,vy:0};pipes=[];score=0;best=parseInt(localStorage.getItem('lb')||'0');state='start';frame=0;}
  function spawnPipe(){const t=H*.12+Math.random()*(H*.58-H*.12);pipes.push({x:W+PW,topH:t,passed:false});}
  function drawBG(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f0c29');g.addColorStop(.5,'#302b63');g.addColorStop(1,'#24243e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<25;i++){const sx=(i*137)%W,sy=(i*89)%(H*.65);ctx.globalAlpha=.3+.7*Math.abs(Math.sin(frame*.025+sx*.1));ctx.fillStyle='#fff';ctx.fillRect(sx,sy,2,2);}ctx.globalAlpha=1;const gg=ctx.createLinearGradient(0,H-70,0,H);gg.addColorStop(0,'#2d5a27');gg.addColorStop(1,'#1a3a16');ctx.fillStyle=gg;ctx.fillRect(0,H-70,W,70);ctx.fillStyle='#3a7a32';for(let i=0;i<W+40;i+=40){const wb=Math.sin(frame*.02+i*.15)*5;ctx.beginPath();ctx.ellipse(i,H-70+wb,22,16,0,0,Math.PI*2);ctx.fill();}}
  function drawPipe(p){const pg=ctx.createLinearGradient(p.x,0,p.x+PW,0);pg.addColorStop(0,'#3d7a35');pg.addColorStop(.4,'#5aad4e');pg.addColorStop(1,'#2a5c24');ctx.fillStyle=pg;ctx.beginPath();ctx.roundRect(p.x,0,PW,p.topH-12,[0,0,8,8]);ctx.fill();ctx.beginPath();ctx.roundRect(p.x-7,p.topH-30,PW+14,30,[6,6,0,0]);ctx.fill();ctx.beginPath();ctx.roundRect(p.x-7,p.topH+GAP(),PW+14,30,[0,0,6,6]);ctx.fill();ctx.beginPath();ctx.roundRect(p.x,p.topH+GAP()+30,PW,H-p.topH-GAP()-30-70,[0,0,8,8]);ctx.fill();}
  function drawBird(){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.max(-.5,Math.min(1.3,bird.vy*.08)));const bob=state==='start'?Math.sin(frame*.07)*4:0;ctx.translate(0,bob);const r=BS+4;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.closePath();ctx.clip();if(BI.complete&&BI.naturalWidth>0)ctx.drawImage(BI,-r,-r,r*2,r*2);else{ctx.fillStyle='#FFB800';ctx.fill();}ctx.restore();}
  function drawScore(){ctx.textAlign='center';ctx.font='bold 48px monospace';ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillText(score,W/2+3,75);ctx.fillStyle='#fff';ctx.fillText(score,W/2,72);}
  function panel(t1,t2,sub,ex){ctx.fillStyle='rgba(0,0,0,.65)';ctx.beginPath();ctx.roundRect(W/2-140,H/2-105,280,200,22);ctx.fill();ctx.textAlign='center';ctx.font='bold 24px monospace';ctx.fillStyle='#ffdd00';ctx.fillText(t1,W/2,H/2-62);if(t2!==null){ctx.font='bold 52px monospace';ctx.fillStyle='#fff';ctx.fillText(t2,W/2,H/2-5);}ctx.font='15px monospace';ctx.fillStyle='#ffffffcc';ctx.fillText(sub,W/2,H/2+30);if(ex){ctx.font='bold 13px monospace';ctx.fillStyle=score>=best?'#66FF99':'#ffffffaa';ctx.fillText(ex,W/2,H/2+58);}}
  function checkHit(){if(bird.y+BS*.82>H-70||bird.y-BS*.82<0)return true;for(const p of pipes){if(bird.x+BS*.7>p.x&&bird.x-BS*.7<p.x+PW)if(bird.y-BS*.78<p.topH||bird.y+BS*.78>p.topH+GAP())return true;}return false;}
  function jump(){if(state==='start'){state='playing';bird.vy=J;spawnPipe();}else if(state==='playing')bird.vy=J;else if(state==='over'){init();state='playing';bird.vy=J;spawnPipe();}}
  function loop(){raf=requestAnimationFrame(loop);frame++;ctx.clearRect(0,0,W,H);drawBG();pipes.forEach(drawPipe);drawBird();if(state==='playing'){bird.vy+=G;bird.y+=bird.vy;pipes.forEach(p=>{p.x-=SP;if(!p.passed&&p.x+PW<bird.x){p.passed=true;score++;if(score>best){best=score;localStorage.setItem('lb',best);}}});pipes=pipes.filter(p=>p.x>-PW-30);if(!pipes.length||pipes[pipes.length-1].x<W-W*.52)spawnPipe();if(checkHit())state='over';}if(state==='playing'||state==='over')drawScore();if(state==='start')panel('\uD83D\uDC26 LEO BIRD',null,'แตะเพื่อเริ่ม',best>0?'\uD83C\uDFC6 สถิติ: '+best:null);if(state==='over')panel('เกมจบแล้ว!',score,'แตะเพื่อเล่นใหม่',score>=best?'\uD83C\uDFC6 สถิติใหม่!':'สถิติ: '+best);}
  function ok(e){jump();}
  function ot(e){e.preventDefault();jump();}
  function ok2(e){if(e.code==='Space'){e.preventDefault();jump();}}
  return{start(c){W=c.width;H=c.height;init();c.addEventListener('click',ok);c.addEventListener('touchstart',ot,{passive:false});document.addEventListener('keydown',ok2);loop();},stop(){cancelAnimationFrame(raf);gc.removeEventListener('click',ok);gc.removeEventListener('touchstart',ot);document.removeEventListener('keydown',ok2);}};
})();

// ===================== GAME2: เอเลี่ยน LEO =====================
const Game2=(()=>{
  const FACE=new Image();FACE.src=FACE_B64;
  const PIXEL_RES=48; // resolution of boss pixelation (higher = more pixels, sharper)
  let W,H,raf,frame,state,score,best;
  let ship,bullets,eBullets,pixels,parts,items;
  let bossHP,bossMaxHP,shootT,bossX,bossY,bossVX,bossPhase,bossDead;
  let powerup={spread:0,rapid:0};
  // rage meter
  let rage=0,rageMax=100,rageMode=0,rageFlash=0;
  // joystick state
  let joyActive=false,joyStartX=0,joyStartY=0,joyDX=0,joyDY=0;
  let mouseDown=false,mousePX=0,mousePY=0;
  let keys={};
  let autoFire=0,rapidMult=1;

  function buildPixels(){
    if(!FACE.complete||!FACE.naturalWidth){setTimeout(buildPixels,80);return;}
    const off=document.createElement('canvas');
    off.width=PIXEL_RES;off.height=PIXEL_RES;
    const oc=off.getContext('2d');
    oc.imageSmoothingEnabled=false;
    oc.drawImage(FACE,0,0,PIXEL_RES,PIXEL_RES);
    const d=oc.getImageData(0,0,PIXEL_RES,PIXEL_RES).data;
    pixels=[];
    for(let row=0;row<PIXEL_RES;row++){
      for(let col=0;col<PIXEL_RES;col++){
        const i=(row*PIXEL_RES+col)*4;
        const a=d[i+3];
        if(a>40) pixels.push({col,row,r:d[i],g:d[i+1],b:d[i+2],alive:true,flash:0});
      }
    }
    bossHP=pixels.filter(p=>p.alive).length;
    bossMaxHP=bossHP;
  }

  function pxSize(){return Math.min(Math.floor(W*0.62/PIXEL_RES),12);}
  function bossW(){return PIXEL_RES*pxSize();}
  function bossH(){return PIXEL_RES*pxSize();}

  function init(){
    frame=0;score=0;best=parseInt(localStorage.getItem('lg2')||'0');
    state='start';
    ship={x:W/2,y:H-80,vx:0,vy:0,speed:3.5,r:18};
    bullets=[];eBullets=[];parts=[];items=[];
    bossPhase=1;bossDead=false;
    bossX=W/2;bossY=60;bossVX=1;
    shootT=90;
    powerup={spread:0,rapid:0};
    rage=0;rageMode=0;rageFlash=0;
    joyActive=false;joyDX=0;joyDY=0;
    mouseDown=false;
    autoFire=0;rapidMult=1;
    buildPixels();
  }

  function drawBG(){
    ctx.fillStyle='#06060f';ctx.fillRect(0,0,W,H);
    for(let i=0;i<50;i++){
      const sx=(i*173+frame*.08)%W;
      const sy=(i*97+frame*(i%3===0?.4:.2))%H;
      ctx.globalAlpha=.15+.6*Math.abs(Math.sin(frame*.02+i));
      ctx.fillStyle='#ffffff';ctx.fillRect(sx,sy,1.2,1.2);
    }
    ctx.globalAlpha=1;
  }

  function drawShip(){
    const x=ship.x,y=ship.y,r=ship.r;
    // glow
    ctx.shadowColor='#00f7ff';ctx.shadowBlur=12;
    ctx.strokeStyle='#00f7ff';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x,y-r);ctx.lineTo(x-r*.7,y+r*.6);ctx.lineTo(x,y+r*.2);ctx.lineTo(x+r*.7,y+r*.6);ctx.closePath();ctx.stroke();
    ctx.fillStyle='rgba(0,247,255,.15)';ctx.fill();
    ctx.shadowBlur=0;
    // cockpit
    ctx.fillStyle='#ffdd00';ctx.shadowColor='#ffdd00';ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(x,y-r*.1,r*.25,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // engine
    if(frame%6<3){
      ctx.fillStyle='#ff6600';
      ctx.beginPath();ctx.moveTo(x-r*.3,y+r*.5);ctx.lineTo(x+r*.3,y+r*.5);ctx.lineTo(x,y+r+6);ctx.closePath();ctx.fill();
    }
    // powerup indicator
    if(rageMode>0){ctx.fillStyle='#ff2200';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('🔥RAGE',x,y-r-8);}
    else if(powerup.spread>0){ctx.fillStyle='#ff44ff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('SPR',x,y-r-8);}
    if(powerup.rapid>0&&rageMode===0){ctx.fillStyle='#ffaa00';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText('RPI',x,y-r-(powerup.spread>0?20:8));}
    // rage aura
    if(rageMode>0){
      ctx.globalAlpha=0.25+0.2*Math.sin(frame*0.3);
      ctx.shadowColor='#ff4400';ctx.shadowBlur=20;
      ctx.strokeStyle='#ff4400';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(x,y,r+8+Math.sin(frame*0.2)*3,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=1;ctx.shadowBlur=0;
    }
  }

  function drawBoss(){
    if(bossDead)return;
    const ps=pxSize(),bw=bossW(),ox=bossX-bw/2,oy=bossY;
    ctx.imageSmoothingEnabled=false;
    pixels.filter(p=>p.alive).forEach(p=>{
      const px=ox+p.col*ps,py=oy+p.row*ps;
      if(p.flash>0){
        ctx.fillStyle='#ffffff';p.flash--;
      } else {
        const darken=bossPhase>=3?0.7:1;
        ctx.fillStyle=`rgb(${Math.round(p.r*darken)},${Math.round(p.g*darken)},${Math.round(p.b*darken)})`;
      }
      ctx.fillRect(Math.round(px),Math.round(py),ps,ps);
    });
    // HP bar
    const alive=pixels.filter(p=>p.alive).length;
    const hpPct=alive/bossMaxHP;
    const bx=ox,by=oy+bossH()+8,bw2=bw,bh=10;
    ctx.fillStyle='#1a1a2a';ctx.fillRect(bx,by,bw2,bh);
    ctx.fillStyle=hpPct>.5?'#00ff88':hpPct>.25?'#ffdd00':'#ff3333';
    ctx.fillRect(bx,by,bw2*hpPct,bh);
    ctx.strokeStyle='#ffffff33';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw2,bh);
    // label
    ctx.shadowColor='#ff4488';ctx.shadowBlur=8;
    ctx.textAlign='center';ctx.font='bold 13px monospace';ctx.fillStyle='#ff4488';
    ctx.fillText('BOSS: LEO  ['+alive+'/'+bossMaxHP+']',bossX,oy-10);
    ctx.shadowBlur=0;
  }

  function drawBullets(){
    bullets.forEach(b=>{
      const isRageBullet=b.col==='#ff4400';
      ctx.shadowColor=isRageBullet?'#ff2200':'#ffff00';
      ctx.shadowBlur=isRageBullet?12:6;
      ctx.fillStyle=b.col||'#ffff55';
      ctx.beginPath();ctx.arc(b.x,b.y,isRageBullet?5:3,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    });
    eBullets.forEach(b=>{
      ctx.shadowColor='#ff3333';ctx.shadowBlur=8;
      ctx.fillStyle='#ff5555';ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    });
  }

  function drawItems(){
    items.forEach(it=>{
      const pulse=.7+.3*Math.sin(frame*.1);
      ctx.globalAlpha=pulse;
      ctx.shadowColor=it.col;ctx.shadowBlur=12;
      ctx.fillStyle=it.col;
      ctx.beginPath();ctx.arc(it.x,it.y,10,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
      ctx.globalAlpha=1;ctx.shadowBlur=0;
      ctx.textAlign='center';ctx.font='bold 9px monospace';ctx.fillStyle='#000';
      ctx.fillText(it.type==='spread'?'SPR':'RPI',it.x,it.y+3);
    });
  }

  function drawParts(){
    parts.forEach(p=>{
      const a=p.life/p.maxLife;
      ctx.globalAlpha=a;
      ctx.fillStyle=p.col;
      ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);
    });
    ctx.globalAlpha=1;
  }

  function drawJoystick(){
    // visualize on canvas too
    if(!joyActive)return;
    const bx=joystickBase.getBoundingClientRect();
    // drawn via DOM
  }

  function drawHUD(){
    ctx.textAlign='left';ctx.font='bold 13px monospace';
    ctx.fillStyle='#00f7ff';ctx.shadowColor='#00f7ff';ctx.shadowBlur=4;
    ctx.fillText('SCORE: '+score,10,22);
    ctx.textAlign='right';ctx.fillStyle='#ffdd00';ctx.shadowColor='#ffdd00';
    ctx.fillText('BEST: '+Math.max(score,best),W-10,22);
    ctx.shadowBlur=0;
    // powerup timers
    let hudY=40;
    if(powerup.spread>0&&rageMode===0){
      ctx.textAlign='left';ctx.fillStyle='#ff44ff';ctx.font='11px monospace';
      ctx.fillText('SPR: '+Math.ceil(powerup.spread/60)+'s',10,hudY);hudY+=16;
    }
    if(powerup.rapid>0&&rageMode===0){
      ctx.textAlign='left';ctx.fillStyle='#ffaa00';ctx.font='11px monospace';
      ctx.fillText('RPI: '+Math.ceil(powerup.rapid/60)+'s',10,hudY);hudY+=16;
    }
    // phase
    ctx.textAlign='center';ctx.font='bold 11px monospace';
    const pcol=['','#00ff88','#ffdd00','#ff3333'][bossPhase]||'#ff3333';
    ctx.fillStyle=pcol;ctx.fillText('PHASE '+bossPhase,W/2,22);

    // === RAGE GAUGE ===
    const gx=10,gy=H-30,gw=W-20,gh=14;
    // background
    ctx.fillStyle='#1a1a2a';ctx.fillRect(gx,gy,gw,gh);
    // fill
    const ragePct=Math.min(1,rage/rageMax);
    if(rageMode>0){
      // rage mode: show countdown, pulse red
      const alpha=0.7+0.3*Math.sin(frame*0.4);
      ctx.globalAlpha=alpha;
      ctx.fillStyle='#ff2200';ctx.fillRect(gx,gy,gw*(rageMode/(60*5)),gh);
      ctx.globalAlpha=1;
    } else {
      // filling gauge: gradient from cyan to red as it fills
      const grad=ctx.createLinearGradient(gx,0,gx+gw,0);
      grad.addColorStop(0,'#00f7ff');grad.addColorStop(0.6,'#ffdd00');grad.addColorStop(1,'#ff2200');
      ctx.fillStyle=grad;ctx.fillRect(gx,gy,gw*ragePct,gh);
    }
    ctx.strokeStyle='#ffffff33';ctx.lineWidth=1;ctx.strokeRect(gx,gy,gw,gh);
    // label
    ctx.textAlign='center';ctx.font='bold 10px monospace';
    if(rageMode>0){
      ctx.fillStyle='#ff2200';ctx.shadowColor='#ff4400';ctx.shadowBlur=6;
      ctx.fillText('🔥 โหมดคลั่ง! '+Math.ceil(rageMode/60)+'วิ',W/2,gy+10);
      ctx.shadowBlur=0;
    } else {
      ctx.fillStyle=ragePct>=1?'#ff2200':'#ffffff88';
      ctx.fillText(ragePct>=1?'กด SPACE / แตะ 🔥 เพื่อเข้าโหมดคลั่ง!':'RAGE '+Math.floor(ragePct*100)+'%',W/2,gy+10);
    }
  }

  function panel2(title,sub,sub2){
    ctx.fillStyle='rgba(0,0,0,.8)';
    ctx.beginPath();ctx.roundRect(W/2-155,H/2-95,310,190,20);ctx.fill();
    ctx.textAlign='center';
    ctx.shadowColor='#ff4488';ctx.shadowBlur=10;
    ctx.font='bold 22px monospace';ctx.fillStyle='#ff4488';ctx.fillText(title,W/2,H/2-52);
    ctx.shadowBlur=0;
    ctx.font='14px monospace';ctx.fillStyle='#ffffffcc';ctx.fillText(sub,W/2,H/2-14);
    if(sub2){ctx.font='bold 15px monospace';ctx.fillStyle='#ffdd00';ctx.fillText(sub2,W/2,H/2+16);}
    ctx.font='12px monospace';ctx.fillStyle='#00f7ffaa';
    ctx.fillText(state==='win'?'แตะเพื่อเล่นใหม่':'แตะหน้าจอเพื่อเริ่ม',W/2,H/2+56);
  }

  function fireBullet(){
    const isRage=rageMode>0;
    const spd=isRage?18:(powerup.rapid>0?13:9);
    const pierce=isRage; // pierce in rage mode
    if(isRage){
      // 6-way spread
      for(let a=0;a<6;a++){
        const ang=-Math.PI/2+(a-2.5)*0.22;
        bullets.push({x:ship.x,y:ship.y-ship.r,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,pierce,col:'#ff4400'});
      }
    } else if(powerup.spread>0){
      // 5-way spread
      for(let a=-2;a<=2;a++){
        const ang=-Math.PI/2+a*0.28;
        bullets.push({x:ship.x,y:ship.y-ship.r,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,pierce:false,col:'#ffff55'});
      }
    } else {
      bullets.push({x:ship.x,y:ship.y-ship.r,vx:0,vy:-spd,pierce:false,col:'#ffff55'});
    }
  }

  function hitPixel(bx,by){
    if(bossDead)return false;
    const ps=pxSize(),bw=bossW(),ox=bossX-bw/2,oy=bossY;
    for(let i=pixels.length-1;i>=0;i--){
      const p=pixels[i];
      if(!p.alive)continue;
      const px=ox+p.col*ps,py=oy+p.row*ps;
      if(bx>=px&&bx<px+ps&&by>=py&&by<py+ps){
        p.alive=false;p.flash=0;
        // spawn particle
        parts.push({x:px+ps/2,y:py+ps/2,s:ps*1.4,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,col:`rgb(${p.r},${p.g},${p.b})`,life:18,maxLife:18});
        score++;
        if(score>best){best=score;localStorage.setItem('lg2',best);}
        // charge rage (not in rage mode)
        if(rageMode===0)rage=Math.min(rageMax,rage+1.2);
        // item drop — more frequent
        if(Math.random()<0.012){
          const t=Math.random()<.5?'spread':'rapid';
          items.push({x:bossX-bossW()/2+p.col*ps+ps/2,y:bossY+p.row*ps+ps/2,vx:(Math.random()-.5)*1.5,vy:2,type:t,col:t==='spread'?'#ff44ff':'#ffaa00'});
        }
        const alive=pixels.filter(p=>p.alive).length;
        bossHP=alive;
        if(alive<bossMaxHP*.5)bossPhase=2;
        if(alive<bossMaxHP*.25)bossPhase=3;
        if(alive===0){bossDead=true;state='win';}
        return true;
      }
    }
    return false;
  }

  function updateShip(){
    // joystick (touch)
    if(joyActive){ship.vx=joyDX*ship.speed;ship.vy=joyDY*ship.speed;}
    else{ship.vx*=.85;ship.vy*=.85;}
    // keyboard — always works (WASD / arrow keys)
    if(keys['ArrowLeft']||keys['KeyA'])ship.vx-=1.0;
    if(keys['ArrowRight']||keys['KeyD'])ship.vx+=1.0;
    if(keys['ArrowUp']||keys['KeyW'])ship.vy-=1.0;
    if(keys['ArrowDown']||keys['KeyS'])ship.vy+=1.0;
    ship.vx=Math.max(-ship.speed,Math.min(ship.speed,ship.vx));
    ship.vy=Math.max(-ship.speed,Math.min(ship.speed,ship.vy));
    ship.x+=ship.vx;ship.y+=ship.vy;
    ship.x=Math.max(ship.r,Math.min(W-ship.r,ship.x));
    ship.y=Math.max(ship.r+30,Math.min(H-ship.r,ship.y));
  }

  function updateBullets(){
    const isRage=rageMode>0;
    const fireRate=isRage?4:(powerup.rapid>0?6:18);
    autoFire++;
    if(autoFire%fireRate===0&&state==='playing') fireBullet();
    bullets=bullets.filter(b=>{
      b.x+=b.vx;b.y+=b.vy;
      if(b.y<-20||b.x<-20||b.x>W+20)return false;
      const hit=hitPixel(b.x,b.y);
      if(hit&&!b.pierce)return false; // pierce bullets go through
      return true;
    });
    // boss shoots
    if(state==='playing'&&!bossDead){
      shootT--;
      const interval=Math.max(30,75-bossPhase*15);
      if(shootT<=0){
        shootT=interval;
        const cnt=bossPhase+1;
        for(let i=0;i<cnt;i++){
          const ang=Math.PI/2+(i-(cnt-1)/2)*.3;
          eBullets.push({x:bossX+(Math.random()-.5)*bossW()*.8,y:bossY+bossH(),vx:Math.cos(ang)*3.5,vy:Math.sin(ang)*3.5});
        }
        // phase3: also aim at player
        if(bossPhase>=3){
          const dx=ship.x-bossX,dy=ship.y-bossY;
          const len=Math.sqrt(dx*dx+dy*dy)||1;
          eBullets.push({x:bossX,y:bossY+bossH()/2,vx:dx/len*5,vy:dy/len*5});
        }
      }
    }
    eBullets=eBullets.filter(b=>{
      b.x+=b.vx;b.y+=b.vy;
      if(b.y>H+10||b.x<-10||b.x>W+10)return false;
      const dx=b.x-ship.x,dy=b.y-ship.y;
      if(Math.sqrt(dx*dx+dy*dy)<ship.r+3&&state==='playing'){state='over';return false;}
      return true;
    });
  }

  function updateBoss(){
    if(bossDead)return;
    const spd=.8+bossPhase*.6;
    bossX+=bossVX*spd;
    if(bossX+bossW()/2>W-8||bossX-bossW()/2<8)bossVX*=-1;
    bossY=60+Math.sin(frame*.025)*20*(bossPhase>=2?2:1);
  }

  function updateParts(){
    parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0;});
  }

  function updateItems(){
    items=items.filter(it=>{
      it.x+=it.vx;it.y+=it.vy;
      if(it.y>H+20)return false;
      const dx=it.x-ship.x,dy=it.y-ship.y;
      if(Math.sqrt(dx*dx+dy*dy)<ship.r+12){
        if(it.type==='spread')powerup.spread=480;
        else powerup.rapid=480;
        return false;
      }
      return true;
    });
    if(powerup.spread>0)powerup.spread--;
    if(powerup.rapid>0)powerup.rapid--;
    // rage mode countdown
    if(rageMode>0){rageMode--;if(rageMode===0)rage=0;}
  }

  function activateRage(){
    if(rage>=rageMax&&rageMode===0&&state==='playing'){
      rageMode=60*5; // 5 seconds at 60fps
      rageFlash=20;
    }
  }

  function gameLoop(){
    raf=requestAnimationFrame(gameLoop);frame++;
    ctx.clearRect(0,0,W,H);drawBG();
    if(state!=='start'){drawBoss();drawItems();drawShip();drawBullets();drawParts();drawHUD();}
    if(state==='playing'){updateShip();updateBullets();updateBoss();updateParts();updateItems();}
    // rage flash effect
    if(rageFlash>0){
      ctx.globalAlpha=rageFlash/20*0.4;
      ctx.fillStyle='#ff2200';ctx.fillRect(0,0,W,H);
      ctx.globalAlpha=1;rageFlash--;
    }
    if(state==='start') panel2('\uD83D\uDC7E เอเลี่ยน LEO','ยิงทำลายพิกเซลบอสให้หมด!',null);
    if(state==='over') panel2('GAME OVER','คะแนน: '+score,'สถิติ: '+Math.max(score,best));
    if(state==='win') panel2('\uD83C\uDF89 ชนะแล้ว!','คะแนน: '+score,'คุณทำลาย LEO ได้แล้ว!');
  }

  // === CONTROLS ===
  const JR=50; // joystick radius
  function joyStart(cx,cy){
    const r=joystickBase.getBoundingClientRect();
    const jcx=r.left+r.width/2,jcy=r.top+r.height/2;
    joyActive=true;joyStartX=jcx;joyStartY=jcy;
    updateJoy(cx,cy);
  }
  function updateJoy(cx,cy){
    if(!joyActive)return;
    let dx=cx-joyStartX,dy=cy-joyStartY;
    const len=Math.sqrt(dx*dx+dy*dy);
    if(len>JR){dx=dx/len*JR;dy=dy/len*JR;}
    joyDX=dx/JR;joyDY=dy/JR;
    joystickStick.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }
  function joyEnd(){joyActive=false;joyDX=0;joyDY=0;joystickStick.style.transform='translate(-50%,-50%)';}

  let joyTouchId=null,fireTouchId=null;
  function onTouchStart2(e){
    e.preventDefault();
    Array.from(e.changedTouches).forEach(t=>{
      const el=document.elementFromPoint(t.clientX,t.clientY);
      if(el===fireBtn||fireBtn.contains(el)){
        fireTouchId=t.identifier;
        if(state==='start'){state='playing';}
        return;
      }
      const jb=joystickBase.getBoundingClientRect();
      const inJoy=t.clientX>=jb.left&&t.clientX<=jb.right&&t.clientY>=jb.top&&t.clientY<=jb.bottom;
      if(inJoy||joyTouchId===null){
        if(joyTouchId===null){joyTouchId=t.identifier;joyStart(t.clientX,t.clientY);}
      }
    });
    if(state==='over'||state==='win'){init();state='playing';}
  }
  function onTouchMove2(e){
    e.preventDefault();
    Array.from(e.changedTouches).forEach(t=>{
      if(t.identifier===joyTouchId)updateJoy(t.clientX,t.clientY);
    });
  }
  function onTouchEnd2(e){
    Array.from(e.changedTouches).forEach(t=>{
      if(t.identifier===joyTouchId){joyEnd();joyTouchId=null;}
      if(t.identifier===fireTouchId){fireTouchId=null;}
    });
  }

  // mouse drag on canvas
  function onMouseDown(e){mouseDown=true;mousePX=e.clientX;mousePY=e.clientY;if(state==='start')state='playing';if(state==='over'||state==='win'){init();state='playing';}}
  function onMouseMove(e){
    if(!mouseDown||state!=='playing')return;
    const dx=e.clientX-mousePX,dy=e.clientY-mousePY;
    ship.x+=dx*1.2;ship.y+=dy*1.2;
    ship.x=Math.max(ship.r,Math.min(W-ship.r,ship.x));
    ship.y=Math.max(ship.r+30,Math.min(H-ship.r,ship.y));
    mousePX=e.clientX;mousePY=e.clientY;
  }
  function onMouseUp(){mouseDown=false;}
  function onKey(e){keys[e.code]=true;if(e.code==='Space'){e.preventDefault();if(state==='start')state='playing';else activateRage();}}
  function onKeyUp(e){keys[e.code]=false;}

  // fire button touch
  fireBtn.addEventListener('touchstart',e=>{e.preventDefault();if(state==='start')state='playing';else if(state==='over'||state==='win'){init();state='playing';}else activateRage();},{passive:false});

  return{
    start(c){
      W=c.width;H=c.height;init();
      joystickWrap.style.display='block';fireBtn.style.display='flex';
      joystickWrap.style.pointerEvents='auto';
      gc.addEventListener('touchstart',onTouchStart2,{passive:false});
      gc.addEventListener('touchmove',onTouchMove2,{passive:false});
      gc.addEventListener('touchend',onTouchEnd2);
      gc.addEventListener('mousedown',onMouseDown);
      window.addEventListener('mousemove',onMouseMove);
      window.addEventListener('mouseup',onMouseUp);
      document.addEventListener('keydown',onKey);
      document.addEventListener('keyup',onKeyUp);
      gameLoop();
    },
    stop(){
      cancelAnimationFrame(raf);
      joystickWrap.style.display='none';fireBtn.style.display='none';
      gc.removeEventListener('touchstart',onTouchStart2);
      gc.removeEventListener('touchmove',onTouchMove2);
      gc.removeEventListener('touchend',onTouchEnd2);
      gc.removeEventListener('mousedown',onMouseDown);
      window.removeEventListener('mousemove',onMouseMove);
      window.removeEventListener('mouseup',onMouseUp);
      document.removeEventListener('keydown',onKey);
      document.removeEventListener('keyup',onKeyUp);
    }
  };
})();
</script>
</body>
</html>
