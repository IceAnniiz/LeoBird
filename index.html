const PIPE_W = 65;
const GAP = H * 0.27;
const PIPE_SPEED = 3;
const GRAVITY = 0.45;
const JUMP = -9;
const BIRD_SIZE = 24;

let bird, pipes, score, best, gameState, frame;

function init() {
  bird = { x: W * 0.25, y: H * 0.45, vy: 0 };
  pipes = [];
  score = 0;
  best = parseInt(localStorage.getItem('fb_best') || '0');
  gameState = 'start';
  frame = 0;
}

function spawnPipe() {
  const minTop = H * 0.12;
  const maxTop = H * 0.58;
  const topH = minTop + Math.random() * (maxTop - minTop);
  pipes.push({ x: W + PIPE_W, topH, passed: false });
}

function drawBG() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0f0c29');
  grad.addColorStop(0.5, '#302b63');
  grad.addColorStop(1, '#24243e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // stars
  const starPositions = [];
  for (let i = 0; i < 30; i++) {
    starPositions.push([
      (i * 137.5) % W,
      (i * 89.3) % (H * 0.65)
    ]);
  }
  starPositions.forEach(([sx, sy]) => {
    const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(frame * 0.025 + sx * 0.1));
    ctx.globalAlpha = twinkle;
    ctx.fillStyle = '#fff';
    ctx.fillRect(sx, sy, 2, 2);
  });
  ctx.globalAlpha = 1;

  // ground
  const groundGrad = ctx.createLinearGradient(0, H - 70, 0, H);
  groundGrad.addColorStop(0, '#2d5a27');
  groundGrad.addColorStop(1, '#1a3a16');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, H - 70, W, 70);

  ctx.fillStyle = '#3a7a32';
  for (let i = 0; i < W + 40; i += 40) {
    const wobble = Math.sin(frame * 0.02 + i * 0.15) * 5;
    ctx.beginPath();
    ctx.ellipse(i, H - 70 + wobble, 22, 16, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPipe(p) {
  const pipeGrad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
  pipeGrad.addColorStop(0, '#3d7a35');
  pipeGrad.addColorStop(0.4, '#5aad4e');
  pipeGrad.addColorStop(1, '#2a5c24');

  // top pipe
  ctx.fillStyle = pipeGrad;
  ctx.beginPath();
  ctx.roundRect(p.x, 0, PIPE_W, p.topH - 12, [0, 0, 8, 8]);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(p.x - 7, p.topH - 30, PIPE_W + 14, 30, [6, 6, 0, 0]);
  ctx.fill();

  // bottom pipe
  ctx.beginPath();
  ctx.roundRect(p.x - 7, p.topH + GAP, PIPE_W + 14, 30, [0, 0, 6, 6]);
  ctx.fill();
  ctx.beginPath();
  ctx.roundRect(p.x, p.topH + GAP + 30, PIPE_W, H - p.topH - GAP - 30 - 70, [0, 0, 8, 8]);
  ctx.fill();

  // shine
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(p.x + 10, 0, 12, p.topH - 12);
  ctx.fillRect(p.x + 10, p.topH + GAP + 30, 12, H - p.topH - GAP - 30 - 70);
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  const angle = Math.max(-0.5, Math.min(1.3, bird.vy * 0.08));
  ctx.rotate(angle);
  const bob = gameState === 'start' ? Math.sin(frame * 0.07) * 4 : 0;
  ctx.translate(0, bob);
  const r = BIRD_SIZE + 4;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();
  if (BIRD_IMG.complete && BIRD_IMG.naturalWidth > 0) {
    ctx.drawImage(BIRD_IMG, -r, -r, r * 2, r * 2);
  } else {
    ctx.fillStyle = '#FFB800';
    ctx.fill();
  }
  ctx.restore();
}

function drawScore() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 48px sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillText(score, W / 2 + 3, 75);
  ctx.fillStyle = '#fff';
  ctx.fillText(score, W / 2, 72);
}

function drawPanel(text1, text2, sub, extra) {
  const pw = 280, ph = 190;
  const px = W / 2 - pw / 2, py = H / 2 - ph / 2;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath();
  ctx.roundRect(px, py, pw, ph, 22);
  ctx.fill();

  ctx.textAlign = 'center';
  ctx.font = 'bold 30px sans-serif';
  ctx.fillStyle = '#FFE066';
  ctx.fillText(text1, W / 2, py + 48);

  if (text2) {
    ctx.font = 'bold 52px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(text2, W / 2, py + 110);
  }

  ctx.font = '16px sans-serif';
  ctx.fillStyle = '#ffffffcc';
  ctx.fillText(sub, W / 2, py + 140);

  if (extra) {
    ctx.font = 'bold 15px sans-serif';
    ctx.fillStyle = '#66FF99';
    ctx.fillText(extra, W / 2, py + 168);
  }
}

function checkCollision() {
  const by = bird.y, bx = bird.x;
  if (by + BIRD_SIZE * 0.82 > H - 70 || by - BIRD_SIZE * 0.82 < 0) return true;
  for (const p of pipes) {
    if (bx + BIRD_SIZE * 0.7 > p.x && bx - BIRD_SIZE * 0.7 < p.x + PIPE_W) {
      if (by - BIRD_SIZE * 0.78 < p.topH || by + BIRD_SIZE * 0.78 > p.topH + GAP) return true;
    }
  }
  return false;
}

function jump() {
  if (gameState === 'start') {
    gameState = 'playing';
    bird.vy = JUMP;
    spawnPipe();
  } else if (gameState === 'playing') {
    bird.vy = JUMP;
  } else if (gameState === 'over') {
    init();
    gameState = 'playing';
    bird.vy = JUMP;
    spawnPipe();
  }
}

function loop() {
  requestAnimationFrame(loop);
  frame++;

  ctx.clearRect(0, 0, W, H);
  drawBG();

  pipes.forEach(drawPipe);
  drawBird();

  if (gameState === 'playing') {
    bird.vy += GRAVITY;
    bird.y += bird.vy;

    pipes.forEach(p => {
      p.x -= PIPE_SPEED;
      if (!p.passed && p.x + PIPE_W < bird.x) {
        p.passed = true;
        score++;
        if (score > best) {
          best = score;
          localStorage.setItem('fb_best', best);
        }
      }
    });

    pipes = pipes.filter(p => p.x > -PIPE_W - 30);

    if (pipes.length === 0 || pipes[pipes.length - 1].x < W - W * 0.52) {
      spawnPipe();
    }

    if (checkCollision()) gameState = 'over';
  }

  if (gameState === 'playing' || gameState === 'over') drawScore();

  if (gameState === 'start') {
    drawPanel(
      '🐦 Flappy Bird',
      null,
      'แตะหน้าจอเพื่อเริ่ม',
      best > 0 ? `🏆 สถิติ: ${best}` : null
    );
  }

  if (gameState === 'over') {
    const extra = score >= best ? '🏆 สถิติใหม่!' : `สถิติ: ${best}`;
    const extraColor = score >= best ? '#66FF99' : '#ffffffaa';
    drawPanel('เกมจบแล้ว!', score, 'แตะเพื่อเล่นใหม่', extra);
  }
}

init();
loop();

canvas.addEventListener('click', jump);
canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); }, { passive: false });
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); jump(); } });
</script>
